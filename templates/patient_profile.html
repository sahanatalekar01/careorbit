<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Profile | CareOrbit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef5ff;
}

.profile-container{
max-width:800px;
margin:70px auto;
}

.profile-card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.title{
color:#0d6efd;
font-weight:700;
margin-bottom:30px;
}

.info{
padding:15px;
background:#f8fbff;
border-radius:12px;
margin-bottom:15px;
}

.back-btn{
border-radius:30px;
padding:10px 25px;
}

</style>

</head>

<body>

<div class="container profile-container">

<div class="profile-card">

<h2 class="title">
<i class="bi bi-person-circle"></i>
Patient Profile
</h2>

<div class="info">
<strong>Name:</strong>
{{ patient.full_name }}
</div>

<div class="info">
<strong>Email:</strong>
{{ patient.email }}
</div>

<div class="info">
<strong>Age:</strong>
{{ patient.age }}
</div>

<div class="info">
<strong>Gender:</strong>
{{ patient.gender }}
</div>

<div class="info">
<strong>Blood Group:</strong>
{{ patient.blood_group if patient.blood_group else "Not Added" }}
</div>

<a href="{{ url_for('patient_dashboard') }}" class="btn btn-primary back-btn">
Back to Dashboard
</a>

</div>

</div>

</body>

</html>
