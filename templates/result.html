<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOrbit - AI Analysis Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fb;
            font-family:Arial,Helvetica,sans-serif;
        }

        .result-card{
            max-width:800px;
            margin:60px auto;
            border:none;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .header{
            background:#0d6efd;
            color:white;
            padding:20px;
            border-radius:18px 18px 0 0;
        }

        .badge-box{
            font-size:18px;
            padding:10px 20px;
        }

        img{
            max-width:250px;
            border-radius:10px;
            margin-top:15px;
        }
    </style>
</head>
<body>

<div class="container">

<div class="card result-card">

<div class="header">
<h2>AI Symptom Analysis Result</h2>
<p class="mb-0">CareOrbit Health Assistant</p>
</div>

<div class="card-body p-4">

<h5>Symptoms</h5>
<p id="symptoms">Loading...</p>

<hr>

<h5>Risk Level</h5>

<span id="risk" class="badge badge-box bg-success">
Loading...
</span>

<hr>

<h5>Recommendation</h5>

<p id="recommendation">
Loading...
</p>

<div id="imageDiv" style="display:none;">
<hr>

<h5>Uploaded Image</h5>

<img id="uploadedImage">
</div>

<div class="text-center mt-4">

<a href="/symptom-analysis" class="btn btn-primary">
Analyze Again
</a>

<a href="/patient-dashboard" class="btn btn-secondary">
Dashboard
</a>

</div>

</div>

</div>

</div>

<script>

const data=JSON.parse(localStorage.getItem("analysisResult"));

if(data){

document.getElementById("symptoms").innerText=data.symptoms;

document.getElementById("recommendation").innerText=data.recommendation;

const badge=document.getElementById("risk");

badge.innerText=data.risk;

if(data.risk==="High")
badge.className="badge badge-box bg-danger";

else if(data.risk==="Moderate")
badge.className="badge badge-box bg-warning text-dark";

else
badge.className="badge badge-box bg-success";

if(data.uploaded_image){

document.getElementById("imageDiv").style.display="block";

document.getElementById("uploadedImage").src="/static/uploads/"+data.uploaded_image;

}

}
else{

document.getElementById("symptoms").innerHTML="<b>No analysis available.</b>";

document.getElementById("recommendation").innerHTML="Please perform symptom analysis first.";

}

</script>

</body>
</html>
