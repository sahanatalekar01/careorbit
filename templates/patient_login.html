<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Login - CareOrbit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


<style>

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e8f5ff, #f8fbff);
}


.login-card {

    border-radius: 20px;
    border: none;

}


.form-control {

    border-radius: 12px;
    padding: 12px;

}


.btn-login {

    border-radius: 12px;
    padding: 12px;
    font-weight: 600;

}


</style>


</head>


<body>


<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container">

<a class="navbar-brand fw-bold text-primary" href="/">
🩺 CareOrbit
</a>

</div>

</nav>




<div class="container py-5">


<div class="row justify-content-center">


<div class="col-md-6">


<div class="card shadow-lg p-4 login-card">


<h2 class="text-center text-primary mb-4">
Patient Login
</h2>



<!-- Flash Messages -->

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">

{{ message }}

<button type="button"
class="btn-close"
data-bs-dismiss="alert">
</button>

</div>

{% endfor %}

{% endif %}

{% endwith %}




<form method="POST" action="{{ url_for('patient_login') }}">



<div class="mb-3">

<label class="form-label">
Email
</label>


<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>





<div class="mb-3">

<label class="form-label">
Password
</label>


<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>

</div>





<div class="d-grid">

<button
type="submit"
class="btn btn-primary btn-login">

Login

</button>

</div>




</form>




<hr>




<p class="text-center">

Don't have an account?

<a href="{{ url_for('patient_register') }}">
Register Here
</a>

</p>




<p class="text-center">

<a href="{{ url_for('home') }}">
    ← Back to Home
</a>

</p>




</div>


</div>


</div>


</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap.bundle.min.js"></script>


</body>

</html>
