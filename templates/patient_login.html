<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOrbit - Patient Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#1063e5 0%,#083380 100%);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            border:none;
            border-radius:20px;
            background:#fff;
            box-shadow:0 15px 35px rgba(0,0,0,.2);
            width:100%;
            max-width:450px;
            padding:40px;
        }

        .form-control{
            border-radius:10px;
            padding:12px 15px;
            border:1px solid #dee2e6;
        }

        .form-control:focus{
            border-color:#1063e5;
            box-shadow:0 0 0 .25rem rgba(16,99,229,.15);
        }

        .btn-login{
            background:#1063e5;
            color:#fff;
            border:none;
            border-radius:10px;
            padding:12px;
            font-weight:600;
            transition:.3s;
        }

        .btn-login:hover{
            background:#0d4bb3;
            transform:translateY(-1px);
        }

        .alert-success{
            background:#d1e7dd;
            color:#0f5132;
            border:1px solid #badbcc;
            border-radius:10px;
            padding:12px 15px;
            margin-bottom:20px;
            font-weight:500;
            text-align:center;
            box-shadow:0 3px 8px rgba(0,0,0,.08);
        }

        .alert-danger,
        .alert-warning,
        .alert-info{
            border-radius:10px;
        }

        .form-check-input:checked{
            background:#1063e5;
            border-color:#1063e5;
        }

        .input-group-text{
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="login-card text-center">

    <div class="text-primary fs-1 mb-2">
        <i class="fa-solid fa-user"></i>
    </div>

    <h3 class="fw-bold text-dark mb-1">
        CareOrbit Portal
    </h3>

    <p class="text-muted small mb-4">
        Patient Authentication
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('patient_login') }}">

        <div class="mb-3 text-start">
            <label class="form-label">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <div class="mb-3 text-start">

            <label class="form-label">
                Password
            </label>

            <div class="input-group">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

                <span
                    class="input-group-text"
                    onclick="togglePassword('password',this)">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

        </div>

        <div class="form-check mb-3 text-start">

            <input
                class="form-check-input"
                type="checkbox"
                name="remember"
                id="remember">

            <label
                class="form-check-label small text-muted fw-semibold"
                for="remember">

                Remember Me

            </label>

        </div>

        <button
            type="submit"
            class="btn btn-login w-100">

            <i class="fa-solid fa-right-to-bracket me-2"></i>

            Login

        </button>

    </form>
        <div class="mt-3">

        <a href="/forgot-password" class="text-decoration-none small">
            Forgot Password?
        </a>

    </div>

    <div class="mt-2">

        <span class="small text-muted">
            Don't have an account?
        </span>

        <a href="{{ url_for('patient_register') }}"
           class="text-decoration-none fw-semibold">
            Register
        </a>

    </div>

    <hr>

    <a href="{{ url_for('home') }}"
       class="text-decoration-none small text-muted">

        <i class="fa-solid fa-arrow-left me-1"></i>

        Back to Main Site

    </a>

</div>

<script>

function togglePassword(id, icon){

    const passwordField = document.getElementById(id);
    const eyeIcon = icon.querySelector("i");

    if(passwordField.type === "password"){

        passwordField.type = "text";

        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");

    }else{

        passwordField.type = "password";

        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");

    }

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
