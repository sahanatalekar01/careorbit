<!DOCTYPE html>
<html>
<head>
    <title>Add Medicine - CareOrbit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3 class="mb-4">Add New Medicine</h3>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Medicine Name
                </label>

                <input 
                type="text"
                name="name"
                class="form-control"
                required>
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Category
                </label>

                <input 
                type="text"
                name="category"
                class="form-control"
                required>
            </div>


            <div class="mb-3">
                <label class="form-label">
                    Stock Quantity
                </label>

                <input 
                type="number"
                name="stock"
                class="form-control"
                required>
            </div>


            <div class="mb-3">

                <label class="form-label">
                    Status
                </label>

                <select name="status" class="form-control">

                    <option value="In Stock">
                        In Stock
                    </option>

                    <option value="Low Stock">
                        Low Stock
                    </option>

                    <option value="Out of Stock">
                        Out of Stock
                    </option>

                </select>

            </div>


            <button class="btn btn-primary">
                Add Medicine
            </button>

            <a href="/pharmacy-dashboard" 
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
