<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOrbit - Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            font-family: 'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(135deg, #e8f4ff, #ffffff);
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .login-card{
            width:420px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 10px 30px rgba(0,0,0,0.12);
        }

        .logo{
            text-align:center;
            color:#0d6efd;
            font-size:32px;
            font-weight:700;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#777;
            margin-bottom:30px;
        }


        .form-control{
            border-radius:12px;
            padding:12px;
            border:1px solid #ddd;
        }

        .form-control:focus{
            border-color:#0d6efd;
            box-shadow:0 0 5px rgba(13,110,253,.3);
        }


        .login-btn{
            width:100%;
            background:#0d6efd;
            color:white;
            border:none;
            padding:12px;
            border-radius:12px;
            font-size:16px;
            font-weight:500;
            transition:0.3s;
        }


        .login-btn:hover{
            background:#084298;
        }


        .admin-icon{
            width:80px;
            height:80px;
            background:#e7f1ff;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            font-size:40px;
            color:#0d6efd;
            margin-bottom:20px;
        }


        .footer-text{
            text-align:center;
            margin-top:25px;
            font-size:13px;
            color:#777;
        }

    </style>

</head>


<body>


<div class="login-card">

    <div class="admin-icon">
        👨‍💼
    </div>


    <div class="logo">
        CareOrbit
    </div>

    <p class="subtitle">
        Admin Portal Login
    </p>


    <form method="POST" action="/admin-login">


        <div class="mb-3">
            <label class="form-label">
                Email Address
            </label>

            <input 
                type="email" 
                name="email"
                class="form-control"
                placeholder="Enter admin email"
                required>
        </div>



        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input 
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required>

        </div>



        <button class="login-btn">
            Login as Admin
        </button>


    </form>


    <div class="footer-text">
        © 2026 CareOrbit Healthcare System
    </div>


</div>


</body>
</html>
